<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Clipboard / list icon centered -->
  <g transform="translate(96, 96)" stroke="white" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="20">
    <!-- Card outline -->
    <rect x="20" y="40" width="280" height="280" rx="32" fill="white"/>

    <!-- Top tab -->
    <rect x="100" y="20" width="120" height="44" rx="14" fill="white"/>

    <!-- Checked first line -->
    <circle cx="80" cy="130" r="18" fill="#34D399" stroke="#34D399"/>
    <path d="M 70 130 L 78 138 L 92 124" stroke="white" stroke-width="8"/>
    <line x1="120" y1="130" x2="240" y2="130" stroke="#9CA3AF" stroke-width="14"/>

    <!-- Empty second line -->
    <circle cx="80" cy="190" r="18" fill="white" stroke="#34D399" stroke-width="6"/>
    <line x1="120" y1="190" x2="240" y2="190" stroke="#374151" stroke-width="14"/>

    <!-- Empty third line -->
    <circle cx="80" cy="250" r="18" fill="white" stroke="#34D399" stroke-width="6"/>
    <line x1="120" y1="250" x2="220" y2="250" stroke="#374151" stroke-width="14"/>
  </g>
</svg>
