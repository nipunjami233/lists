<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9A8B"/>
      <stop offset="50%" stop-color="#FF6A88"/>
      <stop offset="100%" stop-color="#FF99AC"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feOffset dy="3" result="offsetBlur"/>
      <feFlood flood-color="rgba(0,0,0,0.15)"/>
      <feComposite in2="offsetBlur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <g opacity="0.18">
    <path d="M 380 100 L 410 130 L 470 70" stroke="white" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <text x="135" y="320"
        font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif"
        font-size="220"
        font-weight="900"
        fill="white"
        text-anchor="middle"
        filter="url(#softShadow)">N</text>

  <g transform="translate(256, 230) scale(0.95)" filter="url(#softShadow)">
    <path d="M 0 25
             C 0 15, -10 0, -25 0
             C -45 0, -55 18, -55 32
             C -55 60, -25 80, 0 100
             C 25 80, 55 60, 55 32
             C 55 18, 45 0, 25 0
             C 10 0, 0 15, 0 25 Z"
          fill="#FFD6E0"/>
  </g>

  <text x="377" y="320"
        font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif"
        font-size="220"
        font-weight="900"
        fill="white"
        text-anchor="middle"
        filter="url(#softShadow)">K</text>

  <text x="256" y="425"
        font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif"
        font-size="48"
        font-weight="600"
        fill="white"
        opacity="0.92"
        text-anchor="middle"
        letter-spacing="4">Nipun · Kavya</text>
</svg>
